<!DOCTYPE html>
<html lang="es">
  <head>
    <script>
      // Apply the shared ProSolutions theme before first paint (same precedence as Core).
      (function () {
        try {
          var preference = "system";
          var themeCookie = document.cookie.split("; ").find(function (part) { return part.indexOf("prosolutions_theme=") === 0; });
          var cookiePreference = themeCookie ? themeCookie.split("=").slice(1).join("=") : "";
          if (cookiePreference === "light" || cookiePreference === "dark") preference = cookiePreference;
          var saved = localStorage.getItem("theme-storage");
          if (saved) {
            var parsed = JSON.parse(saved);
            var stored = parsed && parsed.state && (parsed.state.preference || parsed.state.theme);
            if (!cookiePreference && (stored === "light" || stored === "dark")) preference = stored;
          }
          var dark = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* ignore: light default */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ProJobs — Busca empleo en todos los sectores | ProSolutions</title>
    <meta name="description" content="Busca empleo en cualquier sector: ofertas de otros portales y de empresas en ProJobs, con filtros por modalidad, salario y habilidades, alertas y ofertas guardadas." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#047857" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProSolutions" />
    <meta property="og:title" content="ProJobs — Busca empleo en todos los sectores" />
    <meta property="og:description" content="Busca vacantes de todos los sectores, guarda ofertas y crea alertas." />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:image" content="https://projobs.prosolutions.page/og-image.png" />
