name: Actualizador de Empleos

on:
  schedule:
    - cron: '0 6 * * *' # Se ejecuta todos los días a las 6:00 AM UTC
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script
        run: python generator.py

      - name: Guardar cambios y publicar
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: actualización de empleos" && git push)