<!DOCTYPE html>
<html lang="es">
  <head>
    <script>
      // Apply the resolved theme before first paint to avoid a light/dark flash.
      // Precedence: explicit stored preference > OS prefers-color-scheme > light.
      (function () {
        try {
          var preference = "system";
          var themeCookie = document.cookie.split("; ").find(function (part) { return part.indexOf("prosolutions_theme=") === 0; });
          var cookiePreference = themeCookie ? themeCookie.split("=").slice(1).join("=") : "";
          if (cookiePreference === "light" || cookiePreference === "dark") preference = cookiePreference;
          var saved = localStorage.getItem("theme-storage");
          if (saved) {
            var parsed = JSON.parse(saved);
            var stored = parsed && parsed.state && (parsed.state.preference || parsed.state.theme);
            if (!cookiePreference && (stored === "light" || stored === "dark")) preference = stored;
          }
          var dark =
            preference === "dark" ||
            (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* ignore: fall back to the light default */
        }
      })();
    </script>
    <script>
      // Resolve the shared language before the app mounts.
      (function () {
        try {
          var entry = document.cookie.split("; ").find(function (part) { return part.indexOf("prosolutions_locale=") === 0; });
          var shared = entry ? entry.split("=").slice(1).join("=") : "";
          var saved = localStorage.getItem("prosolutions-core-locale");
          var locale = shared === "en" || shared === "es" ? shared : (saved === "en" || saved === "es" ? saved : "");
          if (!locale) locale = (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "es";
          document.documentElement.lang = locale;
        } catch (e) {
          document.documentElement.lang = (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "es";
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>ProSolutions — Herramientas para tu carrera profesional</title>

    <meta name="theme-color" content="#047857" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#022c22" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Icons and manifest -->

    <!-- Open Graph -->

    <meta property="og:title" content="ProSolutions — Herramientas para tu carrera profesional" />
    <meta
      property="og:description"
      content="Crea tu CV optimizado para ATS con ProCV y encuentra empleo en cualquier sector con ProJobs. Un solo ecosistema para tu carrera."
