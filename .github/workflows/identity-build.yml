name: Identity Build and Regression Tests

on:
  push:
    branches:
      - fix/qa-session-block-1
    paths:
      - "apps/identity/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/identity-build.yml"
  pull_request:
    branches:
      - qa
    paths:
      - "apps/identity/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/identity-build.yml"

permissions:
  contents: read

jobs:
  identity:
    name: Identity TypeScript build and regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prosolutions_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prosolutions_identity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prosolutions_identity?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Validate and apply all Identity migrations to a clean CI database
        run: npx prisma migrate deploy --schema apps/identity/prisma/schema.prisma
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/identity/prisma/schema.prisma
      - name: Run Identity regression tests
        run: npm run test:regression --workspace=proidentity
      - name: Build Identity
        run: npm run build --workspace=proidentity
