name: Identity Build and Regression Tests

on:
  push:
    branches:
      - fix/qa-session-block-1
    paths:
      - "apps/identity/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/identity-build.yml"
  pull_request:
    branches:
      - qa
    paths:
      - "apps/identity/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/identity-build.yml"

permissions:
  contents: read

jobs:
  identity:
    name: Identity TypeScript, lint, and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/identity/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prosolutions_identity?schema=public
      - name: Run Identity regression tests
        run: npm run test:regression --workspace=proidentity
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prosolutions_identity?schema=public
      - name: Lint Identity
        run: npm run lint --workspace=proidentity
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prosolutions_identity?schema=public
      - name: Build Identity
        run: npm run build --workspace=proidentity
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prosolutions_identity?schema=public
