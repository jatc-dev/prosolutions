name: ProCV CI

# Pipeline de validacion de ProCV (apps/procv + packages/ui) dentro del monorepo
# ProSolutions.
#
# GitHub Actions SOLO lee workflows ubicados en .github/workflows/ de la raiz del
# repositorio. La version anterior vivia en apps/procv/.github/workflows/ci.yml y
# por tanto nunca se ejecuto (AUD-001 de la auditoria).
#
# Decisiones de diseno (verificadas contra los lockfiles del repo):
#   * La instalacion se hace SIEMPRE en la raiz del monorepo (npm ci con el
#     package-lock.json raiz). Es el unico arbol garantizado por el lockfile:
#     incluye los cinco workspaces y resuelve @prosolutions/ui como workspace de
#     packages/ui. Un npm ci dentro de apps/procv/frontend apuntaria a una ruta
#     inexistente (file:../../packages/ui).
#   * El backend y el frontend usan ESLint 9, alineado con el lockfile raiz.
#     La herramienta y los plugins se resuelven desde el arbol de dependencias
#     instalado por npm ci en la raiz del monorepo.
#   * Los dos Dockerfiles usan como contexto la RAIZ del monorepo
#     (COPY apps/procv/... y COPY packages/ui), no ./backend.

on:
  push:
    branches: [main]
    paths:
      - 'apps/procv/**'
      - 'apps/identity/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'
      - '.github/workflows/procv-ci.yml'
  pull_request:
    paths:
      - 'apps/procv/**'
      - 'apps/identity/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'
      - '.github/workflows/procv-ci.yml'
  workflow_dispatch:

# Un push nuevo cancela la ejecucion anterior en lugar de dejar ambas terminar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Los jobs npm no lanzan Chromium (solo pdfGenerator.ts lo usa, en runtime).
  # Evita descargar el navegador de puppeteer en cada instalacion. Las imagenes
  # Docker se construyen en su propio contexto y no se ven afectadas.
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

jobs:
  # Backend: migraciones sobre Postgres de CI, lint, tests y compilacion.
  backend-test:
    name: Backend (migrate, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/procv_test?schema=public

    # PostgreSQL nativo de Actions (sin action de marketplace).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: procv_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        # Node 20 LTS (coincide con produccion); se usa para los jobs del backend.
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (repo root)
        run: npm ci --include=dev --workspaces --include-workspace-root

      # Verificar que ESLint y su plugin de Prettier se resuelvan desde el
      # workspace del backend antes de ejecutar el lint.
      - name: Verify backend ESLint toolchain
        working-directory: apps/procv/backend
        run: |
          for pkg in eslint eslint-plugin-prettier; do
            if node --input-type=module -e "console.log('OK   $pkg ->', import.meta.resolve('$pkg'))"; then
              :
            else
              echo "::error::No se pudo resolver '$pkg' desde apps/procv/backend. El lockfile raiz lo ubica en apps/procv/backend/node_modules; revisa el arbol instalado y el paso de instalacion."
              exit 1
            fi
          done

      - name: Generate Prisma client
        working-directory: apps/procv/backend
        run: npm run prisma:generate

      - name: Run database migrations
        working-directory: apps/procv/backend
        run: npm run prisma:migrate:deploy

      - name: Run linting
        working-directory: apps/procv/backend
        run: npm run lint

      - name: Run tests
        working-directory: apps/procv/backend
        run: npm test -- --coverage --watchAll=false

      - name: Upload coverage reports
        # Solo reporte: nunca rompe el pipeline. En repos privados requiere el
        # secreto CODECOV_TOKEN (Settings -> Secrets); en publicos funciona sin el.
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          file: apps/procv/backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Build application
        working-directory: apps/procv/backend
        run: npm run build

  # Frontend: lint y build (tsc + vite). Comparte la instalacion raiz con el
  # backend porque depende de @prosolutions/ui (packages/ui).
  frontend-test:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (repo root)
        run: npm ci

      - name: Test ProJobs shareable search URL helpers
        working-directory: apps/procv/frontend
        run: npm run test:projobs-search

      - name: Run linting
        working-directory: apps/procv/frontend
        run: npm run lint

      - name: Build application
        working-directory: apps/procv/frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:4000/api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: apps/procv/frontend/dist/

  # Identity: lint and compile the authentication service on every Identity change.
  identity-test:
    name: Identity (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/identity_test?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (repo root)
        run: npm ci --include=dev --workspaces --include-workspace-root

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/identity

      - name: Run linting
        run: npm run lint --workspace=apps/identity

      - name: Build application
        run: npm run build --workspace=apps/identity

  # Escaneo de vulnerabilidades del filesystem (dependencias incluidas).
  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-test, frontend-test]

    permissions:
      # Reemplaza (no se suma) al permissions del workflow: hay que repetir
      # contents: read o actions/checkout falla en un repositorio privado.
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        # Version fijada (nunca @master: las refs mutables son riesgo de supply chain).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-results-sarif
          path: trivy-results.sarif
          if-no-files-found: warn

  # Build de las imagenes Docker con el contexto correcto (raiz del monorepo).
  docker-test:
    name: Docker build (backend, frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/procv/backend/Dockerfile
          push: false
          tags: procv-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/procv/frontend/Dockerfile
          push: false
          tags: procv-frontend:test
          cache-from: type=gha,mode=max
