name: ProJobs — Actualizador de Empleos

on:
  schedule:
    - cron: '0 6 * * *' # Todos los días a las 6:00 AM UTC
  workflow_dispatch: # Permite ejecutarlo manualmente

permissions:
  contents: write # Necesario para commitear la actualización diaria

# Do not cancel an in-flight job that may already be generating and committing data.
concurrency:
  group: projobs-catalog-update
  cancel-in-progress: false

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # apps/projobs es un submódulo del monorepo: sus scripts corren desde su carpeta
      - name: Ejecutar generador de ofertas
        working-directory: apps/projobs
        run: python generator.py

      - name: Validar sintaxis del generador Python
        working-directory: apps/projobs
        run: python -m py_compile generator.py

      - name: Ejecutar pruebas del generador
        working-directory: apps/projobs
        run: python tests/test_generator.py

      - name: Validar JavaScript embebido y escapeHtml en index.html
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const html = readFileSync("apps/projobs/index.html", "utf8");

          // Extraer solo bloques <script> ejecutables (sin atributos: sin src, type, id, async, defer).
          // <script\s*> coincide únicamente con "<script>" seguido de > opcionalmente precedido de espacios.
          // No coincide con "<script async>", "<script id=...>", "<script type=...>", etc.
          const scriptRegex = /<script\s*>([\s\S]*?)<\/script>/g;
          let match;
          let blockCount = 0;
          let escapeHtmlDefined = false;
          let escapeHtmlUsed = false;

          while ((match = scriptRegex.exec(html)) !== null) {
            const block = match[1].trim();
            blockCount++;

            // Validar sintaxis JavaScript de cada bloque de forma independiente.
            // Compilar por separado evita falsos errores por declaraciones const/let repetidas
            // entre bloques independientes que no comparten scope.
            new Function(block);

            // Verificar que escapeHtml esté definida como función (límite de palabra evita
            // falsos positivos como escapeHtmlFoo)
            if (/function\s+escapeHtml\b\s*\(/.test(block)) {
              escapeHtmlDefined = true;
            }

            // Verificar que escapeHtml se utilice realmente
            if (/escapeHtml\s*\(/.test(block)) {
              escapeHtmlUsed = true;
            }
          }

          if (!blockCount) {
            throw new Error("No se encontró ningún bloque <script> ejecutable en index.html");
          }

          console.log(`Encontrados ${blockCount} bloque(s) de JavaScript ejecutable en index.html`);

          if (!escapeHtmlDefined) {
            throw new Error("escapeHtml no está definida como función en el JavaScript embebido");
          }

          if (!escapeHtmlUsed) {
            throw new Error("escapeHtml está definida pero no se invoca en el JavaScript embebido");
          }

          console.log("index.html: JavaScript sintaxis y escapeHtml OK");
          NODE

      - name: Guardar cambios y publicar
        working-directory: apps/projobs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html privacidad.html sitemap.xml
          if ! git diff --staged --quiet; then
            git commit -m 'Auto: actualización de empleos'
            git push
          fi
