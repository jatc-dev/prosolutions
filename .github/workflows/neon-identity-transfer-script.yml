name: Neon Identity transfer script validation

on:
  pull_request:
    paths:
      - 'scripts/maintenance/migrate-proidentity-data-to-neon.sh'
      - '.github/workflows/neon-identity-transfer-script.yml'
  push:
    branches: [ops/neon-identity-data-transfer-2026-10]
    paths:
      - 'scripts/maintenance/migrate-proidentity-data-to-neon.sh'
      - '.github/workflows/neon-identity-transfer-script.yml'

permissions:
  contents: read

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/maintenance/migrate-proidentity-data-to-neon.sh
      - name: Ensure no connection URLs are hard-coded
        run: |
          if grep -nE 'postgres(ql)?://[^[:space:]]+:[^[:space:]]+@' scripts/maintenance/migrate-proidentity-data-to-neon.sh; then
            echo 'Do not commit database connection URLs.' >&2
            exit 1
          fi

  transfer-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      SUPABASE_IDENTITY_URL: postgresql://postgres:postgres@localhost:5432/proidentity_source
      NEON_IDENTITY_URL: postgresql://postgres:postgres@localhost:5432/proidentity
      NEON_IDENTITY_RUNTIME_URL: postgresql://proidentity_login:test-only@localhost:5432/proidentity
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create source and target test databases and restricted runtime login
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE proidentity_source'
          psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE proidentity'
          psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE proidentity_app NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE proidentity_login LOGIN PASSWORD 'test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'GRANT proidentity_app TO proidentity_login'
      - name: Create schemas from the committed Prisma migrations
        run: |
          for db in proidentity_source proidentity; do
            url="postgresql://postgres:postgres@localhost:5432/$db"
            psql "$url" -v ON_ERROR_STOP=1 -f apps/identity/prisma/migrations/20261020000000_init/migration.sql
            psql "$url" -v ON_ERROR_STOP=1 -f apps/identity/prisma/migrations/add_jti_column/migration.sql
            psql "$url" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public."_prisma_migrations" (id VARCHAR(36) NOT NULL PRIMARY KEY, checksum VARCHAR(64) NOT NULL, finished_at TIMESTAMPTZ, migration_name VARCHAR(255) NOT NULL, logs TEXT, rolled_back_at TIMESTAMPTZ, started_at TIMESTAMPTZ NOT NULL DEFAULT now(), applied_steps_count INTEGER NOT NULL DEFAULT 0)'
            psql "$url" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\"_prisma_migrations\" (id,checksum,finished_at,migration_name,started_at,applied_steps_count) VALUES ('11111111-1111-4111-8111-111111111111',repeat('a',64),'2026-10-20 00:00:00+00','20261020000000_init','2026-10-20 00:00:00+00',1),('22222222-2222-4222-8222-222222222222',repeat('b',64),'2026-10-20 00:01:00+00','add_jti_column','2026-10-20 00:01:00+00',1)"
          done
      - name: Configure target RLS policies and seed synthetic source rows
        run: |
          target="$NEON_IDENTITY_URL"
          psql "$target" -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA public TO proidentity_app'
          psql "$target" -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON TYPE public."Module" TO proidentity_app'
          for table in User Session PasswordResetToken EmailVerificationToken ProfessionalProfile ModuleAccess AuditLog; do
            psql "$target" -v ON_ERROR_STOP=1 -c "ALTER TABLE public.\"$table\" ENABLE ROW LEVEL SECURITY"
            psql "$target" -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.\"$table\" TO proidentity_app"
            psql "$target" -v ON_ERROR_STOP=1 -c "CREATE POLICY \"${table}_app_access\" ON public.\"$table\" FOR ALL TO proidentity_app USING (true) WITH CHECK (true)"
          done
          psql "$SUPABASE_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\"User\" (id,email,name,\"passwordHash\",role,\"lastLoginAt\",\"createdAt\",\"updatedAt\",\"emailVerified\",\"isActive\") VALUES ('test-user-1','test@example.invalid','Synthetic Test','not-a-real-password-hash','user','2026-01-02 00:00:00','2026-01-01 00:00:00','2026-01-03 00:00:00',true,true)"
          # The target deliberately has the same identity fields but stale activity timestamps.
          psql "$NEON_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\"User\" (id,email,name,\"passwordHash\",role,\"lastLoginAt\",\"createdAt\",\"updatedAt\",\"emailVerified\",\"isActive\") VALUES ('test-user-1','test@example.invalid','Synthetic Test','not-a-real-password-hash','user','2026-01-01 12:00:00','2026-01-01 00:00:00','2026-01-02 00:00:00',true,true)"
          psql "$SUPABASE_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\"Session\" (id,\"userId\",\"refreshToken\",jti,\"expiresAt\",\"createdAt\",\"lastAccessedAt\") VALUES ('test-session-1','test-user-1','synthetic-refresh-token','synthetic-jti','2027-01-01 00:00:00','2026-01-01 00:00:00','2026-01-01 00:00:00')"
          psql "$SUPABASE_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\"EmailVerificationToken\" (id,\"userId\",\"tokenHash\",\"expiresAt\",used,\"createdAt\") VALUES ('test-email-token-1','test-user-1','synthetic-token-hash','2027-01-01 00:00:00',false,'2026-01-01 00:00:00')"
          psql "$SUPABASE_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\"ProfessionalProfile\" (id,\"userId\",skills,experience,education,links,\"createdAt\",\"updatedAt\") VALUES ('test-profile-1','test-user-1',jsonb_build_array('sql'),'[]'::jsonb,'[]'::jsonb,'{}'::jsonb,'2026-01-01 00:00:00','2026-01-01 00:00:00')"
          psql "$SUPABASE_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\"ModuleAccess\" (id,\"userId\",module,\"grantedAt\",active) VALUES ('test-module-access-1','test-user-1','PROCV','2026-01-01 00:00:00',true)"
          psql "$SUPABASE_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\"AuditLog\" (id,\"userId\",action,resource,\"details\",\"createdAt\") VALUES ('test-audit-1','test-user-1','migration-test','User','{}'::jsonb,'2026-01-01 00:00:00')"
      - name: Verify transfer refuses an unsafe runtime role
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/proidentity" -v ON_ERROR_STOP=1 -c 'ALTER ROLE proidentity_login SUPERUSER BYPASSRLS'
          if bash scripts/maintenance/migrate-proidentity-data-to-neon.sh >/tmp/proidentity-unsafe-role.log 2>&1; then
            echo 'Transfer unexpectedly accepted an unsafe runtime role.' >&2
            exit 1
          fi
          grep -q 'must be LOGIN without SUPERUSER' /tmp/proidentity-unsafe-role.log
          psql "postgresql://postgres:postgres@localhost:5432/proidentity" -v ON_ERROR_STOP=1 -c 'ALTER ROLE proidentity_login NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
      - name: Run data transfer and verify content digests
        run: bash scripts/maintenance/migrate-proidentity-data-to-neon.sh
      - name: Verify unexpected non-timestamp User drift is rejected
        run: |
          psql "$SUPABASE_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "UPDATE public.\"User\" SET name = 'Unexpected drift' WHERE id = 'test-user-1'"
          if bash scripts/maintenance/migrate-proidentity-data-to-neon.sh >/tmp/proidentity-unexpected-user-drift.log 2>&1; then
            echo 'Transfer unexpectedly accepted a non-timestamp User difference.' >&2
            exit 1
          fi
          grep -q 'User identity or non-activity fields differ' /tmp/proidentity-unexpected-user-drift.log
      - name: Verify unexpected target User rows are rejected
        run: |
          psql "$SUPABASE_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "UPDATE public.\"User\" SET name = 'Synthetic Test' WHERE id = 'test-user-1'"
          psql "$NEON_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\"User\" (id,email,name,\"passwordHash\",role,\"createdAt\",\"updatedAt\",\"emailVerified\",\"isActive\") VALUES ('unexpected-target-user','unexpected@example.invalid','Unexpected','not-a-real-password-hash','user','2026-01-01 00:00:00','2026-01-01 00:00:00',true,true)"
          if bash scripts/maintenance/migrate-proidentity-data-to-neon.sh >/tmp/proidentity-unexpected-target-user.log 2>&1; then
            echo 'Transfer unexpectedly accepted an extra target User row.' >&2
            exit 1
          fi
          grep -q 'User identity or non-activity fields differ' /tmp/proidentity-unexpected-target-user.log

      - name: Verify timestamp drift for multiple users is rejected
        run: |
          psql "$NEON_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM public.\\"User\\" WHERE id = 'unexpected-target-user'"
          psql "$SUPABASE_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\\"User\\" (id,email,name,\\"passwordHash\\",role,\\"lastLoginAt\\",\\"createdAt\\",\\"updatedAt\\",\\"emailVerified\\",\\"isActive\\") VALUES ('test-user-2','test2@example.invalid','Synthetic Test 2','not-a-real-password-hash','user','2026-01-02 00:00:00','2026-01-01 00:00:00','2026-01-03 00:00:00',true,true)"
          psql "$NEON_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.\\"User\\" (id,email,name,\\"passwordHash\\",role,\\"lastLoginAt\\",\\"createdAt\\",\\"updatedAt\\",\\"emailVerified\\",\\"isActive\\") VALUES ('test-user-2','test2@example.invalid','Synthetic Test 2','not-a-real-password-hash','user','2026-01-01 12:00:00','2026-01-01 00:00:00','2026-01-02 00:00:00',true,true)"
          psql "$NEON_IDENTITY_URL" -v ON_ERROR_STOP=1 -c "UPDATE public.\\"User\\" SET \\"lastLoginAt\\" = '2026-01-01 12:00:00', \\"updatedAt\\" = '2026-01-02 00:00:00' WHERE id = 'test-user-1'"
          if bash scripts/maintenance/migrate-proidentity-data-to-neon.sh >/tmp/proidentity-multiple-timestamp-drift.log 2>&1; then
            echo 'Transfer unexpectedly accepted timestamp drift for multiple users.' >&2
            exit 1
          fi
          grep -q 'only exactly one is permitted' /tmp/proidentity-multiple-timestamp-drift.log
