name: ProJobs lockfile generation (temporary)
on:
  push:
    branches:
      - feat/projobs-persistence-foundation
    paths:
      - "apps/projobs/server/package.json"
      - ".github/workflows/projobs-lockgen.yml"
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile from pinned server dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix apps/projobs/server
      - uses: actions/upload-artifact@v4
        with:
          name: projobs-server-lockfile
          path: apps/projobs/server/package-lock.json
          if-no-files-found: error
          retention-days: 3
