name: Core and ProJobs Build Validation

on:
  push:
    branches:
      - main
    paths:
      - "apps/core/**"
      - "apps/projobs/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/core/**"
      - "apps/projobs/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-build.yml"

permissions:
  contents: read
  pull-requests: read

# Keep independent validation jobs, but only run each module's work when its
# paths (or shared dependencies) change.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect affected modules
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      projobs: ${{ steps.filter.outputs.projobs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'apps/core/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/core-build.yml'
            projobs:
              - 'apps/projobs/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/core-build.yml'

  core-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true'
    name: Core (TypeScript + Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Build Core and shared UI
        run: npm run build:core
        env:
          VITE_ADSENSE_CLIENT: ca-pub-3956322934366702
      - name: Verify published AdSense assets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const expectedAdsTxt = "google.com, pub-3956322934366702, DIRECT, f08c47fec0942fa0";
          const sourceAdsTxt = readFileSync("apps/core/public/ads.txt", "utf8").trim();
          const builtAdsTxt = readFileSync("apps/core/dist/ads.txt", "utf8").trim();
          const html = readFileSync("apps/core/dist/index.html", "utf8");

          if (sourceAdsTxt !== expectedAdsTxt) throw new Error("apps/core/public/ads.txt has an unexpected publisher line");
          if (builtAdsTxt !== expectedAdsTxt) throw new Error("Vite did not publish the expected /ads.txt file");
          if (!html.includes("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3956322934366702")) {
            throw new Error("Built ProSolutions HTML is missing the configured AdSense loader");
          }
          if (!html.includes('crossorigin="anonymous"')) throw new Error("AdSense loader must use crossorigin=anonymous");
          if (html.includes("%VITE_ADSENSE_CLIENT%")) throw new Error("AdSense client placeholder was not substituted during build");

          console.log("ProSolutions ads.txt and global AdSense loader verified in dist/");
          NODE

  projobs-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.projobs == 'true'
    name: ProJobs (generator + static build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate ProJobs auth client syntax
        run: node --check apps/projobs/auth.js
      - name: Compile ProJobs generator
        run: python -m py_compile apps/projobs/generator.py
      - name: Run ProJobs generator tests
        working-directory: apps/projobs
        run: cp tests/fixtures/jobs.json jobs.json && python tests/test_generator.py && python tests/test_catalog_quality.py
        env:
          PROJOBS_SKIP_FETCH: "1"
      - name: Setup Node.js for ProJobs API
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/projobs/server/package-lock.json
      - name: Install ProJobs API dependencies
        run: npm ci --prefix apps/projobs/server
      - name: Build ProJobs API
        run: npm run build --prefix apps/projobs/server
      - name: Test ProJobs API authorization and validation
        run: npm test --prefix apps/projobs/server
      - name: Build ProJobs from cached job data
        run: npm run build --workspace=@prosolutions/projobs
        env:
          PROJOBS_SKIP_FETCH: "1"
      - name: Validate embedded localization scripts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          for (const file of ["apps/projobs/dist/index.html", "apps/projobs/dist/privacidad.html", "apps/projobs/dist/mi-cuenta.html"]) {
            const html = readFileSync(file, "utf8");
            const marker = html.indexOf("const COPY");
            if (marker < 0) throw new Error(`Localization script missing in ${file}`);
            const start = html.lastIndexOf("<script>", marker);
            const end = html.indexOf("</script>", start);
            if (start < 0 || end < 0) throw new Error(`Invalid inline script in ${file}`);
            new Function(html.slice(start + "<script>".length, end));
            console.log(`${file}: localization script syntax OK`);
          }
          NODE

      - name: Validate JavaScript syntax and escapeHtml in ProJobs index.html
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const html = readFileSync("apps/projobs/dist/index.html", "utf8");

          // Extraer solo bloques <script> ejecutables (sin atributos: sin src, type, id, async, defer).
          const scriptRegex = /<script\s*>([\s\S]*?)<\/script>/g;
          let match;
          let blockCount = 0;
          let escapeHtmlDefined = false;
          let escapeHtmlUsed = false;

          while ((match = scriptRegex.exec(html)) !== null) {
            const block = match[1].trim();
            blockCount++;

            // Validar sintaxis JavaScript de cada bloque de forma independiente.
            // Compilar por separado evita falsos errores por declaraciones const/let repetidas
            // entre bloques independientes que no comparten scope.
            new Function(block);

            // Verificar que escapeHtml esté definida como función (límite de palabra evita
            // falsos positivos como escapeHtmlFoo)
            if (/function\s+escapeHtml\b\s*\(/.test(block)) {
              escapeHtmlDefined = true;
            }

            // Verificar que escapeHtml se utilice realmente
            if (/escapeHtml\s*\(/.test(block)) {
              escapeHtmlUsed = true;
            }
          }

          if (!blockCount) {
            throw new Error("No se encontró ningún bloque <script> ejecutable en dist/index.html");
          }

          console.log(`Encontrados ${blockCount} bloque(s) de JavaScript ejecutable en dist/index.html`);

          if (!escapeHtmlDefined) {
            throw new Error("escapeHtml no está definida como función en el JavaScript embebido");
          }

          if (!escapeHtmlUsed) {
            throw new Error("escapeHtml está definida pero no se invoca en el JavaScript embebido");
          }

          console.log("dist/index.html: JavaScript sintaxis y escapeHtml OK");
          NODE