name: ProSolutions Monorepo CI

on:
  push:
    branches:
      - main
      - qa
    paths:
      - "apps/core/**"
      - "apps/projobs/**"
      - "apps/procv/backend/**"
      - "apps/procv/frontend/**"
      - "apps/identity/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-build.yml"
      - ".github/workflows/postgres-migration-readiness.yml"
  pull_request:
    branches:
      - main
      - qa
    paths:
      - "apps/core/**"
      - "apps/projobs/**"
      - "apps/procv/backend/**"
      - "apps/procv/frontend/**"
      - "apps/identity/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-build.yml"
      - ".github/workflows/postgres-migration-readiness.yml"

permissions:
  contents: read

jobs:
  core-build:
    name: Core (TypeScript + Vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Design system tokens and palette guard
        run: |
          node packages/ui/scripts/build-tokens.mjs --check
          node packages/ui/scripts/check-palette.mjs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Core workspace dependencies
        run: npm ci --include=dev --workspace=apps/core --include-workspace-root
      - name: Test Core (calculators, consent, ad exclusions, SEO)
        run: npm test --workspace=apps/core
      - name: Build Core with prerendered public pages
        run: npm run build --workspace=apps/core
      - name: Verify prerendered pages, sitemap, robots and ads policy
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";

          const dist = "apps/core/dist";
          const shell = readFileSync(`${dist}/app.html`, "utf8");
          if (!shell.includes('content="noindex, follow"') || shell.includes('rel="canonical"')) throw new Error("app.html (SPA fallback) must be noindex without a canonical");
          const home = readFileSync(`${dist}/index.html`, "utf8");
          if (!home.includes("<h1") || !home.includes('<link rel="canonical" href="https://prosolutions.page/" />')) throw new Error("index.html must be the prerendered landing page");
          for (const html of [shell, home]) if (html.includes("adsbygoogle.js")) throw new Error("AdSense must load only after consent, never from the HTML");
          if (existsSync(`${dist}/ads.txt`)) throw new Error("ads.txt must only be published when ADS_TXT_CONTENT is set");

          const article = readFileSync(`${dist}/academy/hoja-de-vida-ats-2026/index.html`, "utf8");
          for (const needle of ['"@type":"Article"', '"@type":"BreadcrumbList"', 'rel="canonical"', "<h1"]) {
            if (!article.includes(needle)) throw new Error(`Prerendered article is missing ${needle}`);
          }
          for (const page of ["tools/salario-neto", "tools/liquidacion", "tools/contrato-vs-prestacion", "tools/evaluador-cv", "legal/privacidad", "legal/terminos", "legal/cookies", "legal/uso-ia", "nosotros", "contacto"]) {
            const html = readFileSync(`${dist}/${page}/index.html`, "utf8");
            if (!html.includes("<h1") || !html.includes('rel="canonical"')) throw new Error(`${page} was not prerendered`);
          }

          const robots = readFileSync(`${dist}/robots.txt`, "utf8");
          for (const rule of ["Disallow: /admin", "Disallow: /settings", "Disallow: /auth", "Disallow: /dashboard", "Sitemap: https://prosolutions.page/sitemap.xml"]) {
            if (!robots.includes(rule)) throw new Error(`robots.txt is missing "${rule}"`);
          }
          const pages = readFileSync(`${dist}/sitemap-pages.xml`, "utf8");
          if (!pages.includes("/academy/hoja-de-vida-ats-2026") || /prosolutions\.page\/admin(\/|<)/.test(pages)) throw new Error("sitemap-pages.xml is wrong");
          if (!readFileSync(`${dist}/sitemap.xml`, "utf8").includes("<sitemapindex")) throw new Error("sitemap.xml must be a sitemap index");
          console.log("Core prerender, sitemap, robots and ads policy verified");
          NODE
      - name: Verify ads.txt is published from ADS_TXT_CONTENT
        working-directory: apps/core
        env:
          ADS_TXT_CONTENT: google.com, pub-0000000000000000, DIRECT, f08c47fec0942fa0
        run: |
          node scripts/prerender.mjs
          grep -qx "google.com, pub-0000000000000000, DIRECT, f08c47fec0942fa0" dist/ads.txt

  projobs-api:
    name: ProJobs API (typecheck, PostgreSQL/RLS tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/projobs/server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/projobs/server/package-lock.json
      # Same install command as the Render service (standalone lockfile).
      - name: Install ProJobs API dependencies
        run: npm ci --include=dev --workspaces=false
      - name: Typecheck ProJobs API
        run: npm run typecheck
      - name: Test migrations, RLS, auth and API flows (PGlite)
        run: npm test
      - name: Build ProJobs API
        run: npm run build

  projobs-web:
    name: ProJobs web (TypeScript + Vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ProJobs web workspace dependencies
        run: npm ci --include=dev --workspace=apps/projobs --include-workspace-root
      - name: Test ProJobs web
        run: npm test --workspace=apps/projobs
      - name: Build ProJobs web
        run: npm run build --workspace=apps/projobs
      - name: Verify published static assets
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          const html = readFileSync("apps/projobs/dist/index.html", "utf8");
          // AdSense is consent-gated at runtime: the loader must never be in the static HTML.
          if (html.includes("adsbygoogle.js")) throw new Error("AdSense loader must not be hard-coded in index.html");
          // ads.txt lives only on the root domain (prosolutions.page), generated from ADS_TXT_CONTENT.
          if (existsSync("apps/projobs/dist/ads.txt")) throw new Error("ProJobs must not ship a static ads.txt");
          if (!readFileSync("apps/projobs/dist/privacidad.html", "utf8").includes("prosolutions.page/legal/privacidad")) {
            throw new Error("privacidad.html must redirect to the central privacy policy");
          }
          if (!readFileSync("apps/projobs/dist/robots.txt", "utf8").includes("Sitemap:")) throw new Error("robots.txt must reference the sitemap");
          console.log("ProJobs dist: consent-gated ads, central privacy redirect and robots verified");
          NODE

  procv-frontend-build:
    name: ProCV frontend (TypeScript + Vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ProCV frontend workspace dependencies
        run: npm ci --include=dev --workspace=apps/procv/frontend --include-workspace-root
      - name: Test ProCV frontend
        run: npm test --workspace=apps/procv/frontend
      - name: Build ProCV frontend
        run: npm run build --workspace=apps/procv/frontend


  procv-backend-build:
    name: ProCV backend (Prisma + TypeScript build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ProCV backend workspace dependencies
        run: npm ci --include=dev --workspace=apps/procv/backend --include-workspace-root
      - name: Generate ProCV Prisma client
        run: npx prisma generate --schema apps/procv/backend/prisma/schema.prisma
      - name: Build ProCV backend
        run: npm run build --workspace=procv-backend
      - name: Test ProCV authorization and PDF import
        run: npm test --workspace=procv-backend -- --runInBand tests/middleware/auth.test.ts tests/adminMiddleware.test.ts tests/cvImportService.test.ts

  identity:
    name: Identity TypeScript build and regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prosolutions_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prosolutions_identity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prosolutions_identity?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Identity workspace dependencies
        run: npm ci --include=dev --workspace=apps/identity --include-workspace-root
      - name: Validate and apply all Identity migrations to a clean CI database
        run: npx prisma migrate deploy --schema apps/identity/prisma/schema.prisma
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/identity/prisma/schema.prisma
      - name: Run Identity regression tests
        run: npm run test:regression --workspace=proidentity
      - name: Build Identity
        run: npm run build --workspace=proidentity
