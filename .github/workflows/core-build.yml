name: Core and ProJobs Build Validation

on:
  push:
    branches:
      - fix/procv-navigation-clean
    paths:
      - "apps/core/**"
      - "apps/projobs/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/core/**"
      - "apps/projobs/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-build.yml"

permissions:
  contents: read

jobs:
  core-build:
    name: Core (TypeScript + Vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build Core and shared UI
        run: npm run build:core

  projobs-build:
    name: ProJobs (generator + static build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile ProJobs generator
        run: python -m py_compile apps/projobs/generator.py
      - name: Run ProJobs generator tests
        working-directory: apps/projobs
        run: python tests/test_generator.py
      - name: Build ProJobs from cached job data
        run: npm run build --workspace=@prosolutions/projobs
        env:
          PROJOBS_SKIP_FETCH: "1"
      - name: Validate embedded localization scripts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          for (const file of ["apps/projobs/dist/index.html", "apps/projobs/dist/privacidad.html"]) {
            const html = readFileSync(file, "utf8");
            const marker = html.indexOf("const COPY");
            if (marker < 0) throw new Error(`Localization script missing in ${file}`);
            const start = html.lastIndexOf("<script>", marker);
            const end = html.indexOf("</script>", start);
            if (start < 0 || end < 0) throw new Error(`Invalid inline script in ${file}`);
            new Function(html.slice(start + "<script>".length, end));
            console.log(`${file}: localization script syntax OK`);
          }
          NODE

      - name: Validate JavaScript syntax and escapeHtml in ProJobs index.html
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const html = readFileSync("apps/projobs/dist/index.html", "utf8");

          // Extraer solo bloques <script> ejecutables (sin atributos: sin src, type, id, async, defer).
          const scriptRegex = /<script\s*>([\s\S]*?)<\/script>/g;
          let match;
          let blockCount = 0;
          let escapeHtmlDefined = false;
          let escapeHtmlUsed = false;

          while ((match = scriptRegex.exec(html)) !== null) {
            const block = match[1].trim();
            blockCount++;

            // Validar sintaxis JavaScript de cada bloque de forma independiente.
            // Compilar por separado evita falsos errores por declaraciones const/let repetidas
            // entre bloques independientes que no comparten scope.
            new Function(block);

            // Verificar que escapeHtml esté definida como función (límite de palabra evita
            // falsos positivos como escapeHtmlFoo)
            if (/function\s+escapeHtml\b\s*\(/.test(block)) {
              escapeHtmlDefined = true;
            }

            // Verificar que escapeHtml se utilice realmente
            if (/escapeHtml\s*\(/.test(block)) {
              escapeHtmlUsed = true;
            }
          }

          if (!blockCount) {
            throw new Error("No se encontró ningún bloque <script> ejecutable en dist/index.html");
          }

          console.log(`Encontrados ${blockCount} bloque(s) de JavaScript ejecutable en dist/index.html`);

          if (!escapeHtmlDefined) {
            throw new Error("escapeHtml no está definida como función en el JavaScript embebido");
          }

          if (!escapeHtmlUsed) {
            throw new Error("escapeHtml está definida pero no se invoca en el JavaScript embebido");
          }

          console.log("dist/index.html: JavaScript sintaxis y escapeHtml OK");
          NODE
