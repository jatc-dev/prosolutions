name: ProSolutions Monorepo CI

on:
  push:
    branches:
      - main
      - qa
    paths:
      - "apps/core/**"
      - "apps/projobs/**"
      - "apps/procv/backend/**"
      - "apps/procv/frontend/**"
      - "apps/identity/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-build.yml"
      - ".github/workflows/postgres-migration-readiness.yml"
  pull_request:
    branches:
      - main
      - qa
    paths:
      - "apps/core/**"
      - "apps/projobs/**"
      - "apps/procv/backend/**"
      - "apps/procv/frontend/**"
      - "apps/identity/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-build.yml"
      - ".github/workflows/postgres-migration-readiness.yml"

permissions:
  contents: read

jobs:
  core-build:
    name: Core (TypeScript + Vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Design system tokens and palette guard
        run: |
          node packages/ui/scripts/build-tokens.mjs --check
          node packages/ui/scripts/check-palette.mjs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Core workspace dependencies
        run: npm ci --include=dev --workspace=apps/core --include-workspace-root
      - name: Build Core and shared UI
        run: npm run build --workspace=apps/core
        env:
          VITE_ADSENSE_CLIENT: ca-pub-3956322934366702
      - name: Verify published AdSense assets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const expectedAdsTxt = "google.com, pub-3956322934366702, DIRECT, f08c47fec0942fa0";
          const sourceAdsTxt = readFileSync("apps/core/public/ads.txt", "utf8").trim();
          const builtAdsTxt = readFileSync("apps/core/dist/ads.txt", "utf8").trim();
          const html = readFileSync("apps/core/dist/index.html", "utf8");

          if (sourceAdsTxt !== expectedAdsTxt) throw new Error("apps/core/public/ads.txt has an unexpected publisher line");
          if (builtAdsTxt !== expectedAdsTxt) throw new Error("Vite did not publish the expected /ads.txt file");
          if (!html.includes("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3956322934366702")) {
            throw new Error("Built ProSolutions HTML is missing the configured AdSense loader");
          }
          if (!html.includes('crossorigin="anonymous"')) throw new Error("AdSense loader must use crossorigin=anonymous");
          if (html.includes("%VITE_ADSENSE_CLIENT%")) throw new Error("AdSense client placeholder was not substituted during build");

          console.log("ProSolutions ads.txt and global AdSense loader verified in dist/");
          NODE

  projobs-api:
    name: ProJobs API (typecheck, PostgreSQL/RLS tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/projobs/server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/projobs/server/package-lock.json
      # Same install command as the Render service (standalone lockfile).
      - name: Install ProJobs API dependencies
        run: npm ci --include=dev --workspaces=false
      - name: Typecheck ProJobs API
        run: npm run typecheck
      - name: Test migrations, RLS, auth and API flows (PGlite)
        run: npm test
      - name: Build ProJobs API
        run: npm run build

  projobs-web:
    name: ProJobs web (TypeScript + Vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install ProJobs web workspace dependencies
        run: npm ci --include=dev --workspace=apps/projobs --include-workspace-root
      - name: Test ProJobs web
        run: npm test --workspace=apps/projobs
      - name: Build ProJobs web
        run: npm run build --workspace=apps/projobs
      - name: Verify published static assets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const ads = readFileSync("apps/projobs/dist/ads.txt", "utf8").trim();
          if (ads !== "google.com, pub-3956322934366702, DIRECT, f08c47fec0942fa0") throw new Error("ProJobs ads.txt mismatch");
          const html = readFileSync("apps/projobs/dist/index.html", "utf8");
          if (html.includes("%VITE_ADSENSE_CLIENT%")) throw new Error("AdSense placeholder was not substituted");
          if (!readFileSync("apps/projobs/dist/privacidad.html", "utf8").includes("Política de Privacidad")) {
            throw new Error("privacidad.html (linked from the shared footer) is missing");
          }
          console.log("ProJobs dist: ads.txt, AdSense loader and privacy page verified");
          NODE

  procv-frontend-build:
    name: ProCV frontend (TypeScript + Vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install ProCV frontend workspace dependencies
        run: npm ci --include=dev --workspace=apps/procv/frontend --include-workspace-root
      - name: Test ProCV frontend
        run: npm test --workspace=apps/procv/frontend
      - name: Build ProCV frontend
        run: npm run build --workspace=apps/procv/frontend


  procv-backend-build:
    name: ProCV backend (Prisma + TypeScript build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install ProCV backend workspace dependencies
        run: npm ci --include=dev --workspace=apps/procv/backend --include-workspace-root
      - name: Generate ProCV Prisma client
        run: npx prisma generate --schema apps/procv/backend/prisma/schema.prisma
      - name: Build ProCV backend
        run: npm run build --workspace=procv-backend
      - name: Test ProCV authorization and PDF import
        run: npm test --workspace=procv-backend -- --runInBand tests/middleware/auth.test.ts tests/adminMiddleware.test.ts tests/cvImportService.test.ts

  identity:
    name: Identity TypeScript build and regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prosolutions_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prosolutions_identity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prosolutions_identity?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Identity workspace dependencies
        run: npm ci --include=dev --workspace=apps/identity --include-workspace-root
      - name: Validate and apply all Identity migrations to a clean CI database
        run: npx prisma migrate deploy --schema apps/identity/prisma/schema.prisma
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/identity/prisma/schema.prisma
      - name: Run Identity regression tests
        run: npm run test:regression --workspace=proidentity
      - name: Build Identity
        run: npm run build --workspace=proidentity
