services:
  - type: web
    name: proidentity
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://prosolutions.page,https://www.prosolutions.page,https://procv-platform.onrender.com,https://procv.prosolutions.page,https://projobs.prosolutions.page,http://localhost:3000,http://localhost:5173
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: IDENTITY_JWT_SECRET
        sync: false
      - key: IDENTITY_JWT_EXPIRES_IN
        value: 15m
      - key: IDENTITY_JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: IDENTITY_ISSUER
        value: https://identity.prosolutions.page
      - key: IDENTITY_AUDIENCE
        value: prosolutions-api
      - key: FRONTEND_URL
        value: https://prosolutions.page
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_DOMAIN
        value: .prosolutions.page
      - key: CORS_ORIGIN
        value: https://procv.prosolutions.page,https://projobs.prosolutions.page
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@prosolutions.page
      - key: DISABLE_RATE_LIMIT
        value: false
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: 30

  - type: web
    name: prosolutions
    env: static
    region: oregon
    plan: free
    buildCommand: npm run build --workspace=apps/core
    publishPath: apps/core/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_IDENTITY_API_URL
        value: https://identity.prosolutions.page/api/auth
      - key: VITE_PROCV_URL
        value: https://procv.prosolutions.page

  - type: web
    name: procv-frontend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/procv/frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_IDENTITY_API_URL
        value: https://identity.prosolutions.page/api/auth
      - key: VITE_PROSOLUTIONS_URL
        value: https://prosolutions.page
      - key: VITE_PROCV_URL
        value: https://procv.prosolutions.page

  - type: web
    name: procv-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/procv/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: IDENTITY_JWT_SECRET
        sync: false
      - key: IDENTITY_URL
        value: https://identity.prosolutions.page
      - key: FRONTEND_URL
        value: https://procv.prosolutions.page
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
