# IMPORTANT: this Blueprint is NOT reconciled with the live Render services.
# Audit on 2026-11-06 found differences in service runtimes and AutoDeploy settings.
# Do NOT run Blueprint Sync or use this file to recreate/update production services.
# Treat the Render dashboard as the source of truth until a separately approved
# reconciliation has compared service IDs, root dirs, runtimes, commands, domains,
# health checks, environment variables and AutoDeploy behavior.
# Operational docs: docs/deployment/PRODUCTION_ARCHITECTURE.md
# This warning intentionally does not alter any service definitions below.

services:
  - type: web
    name: proidentity
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://prosolutions.page,https://www.prosolutions.page,https://procv-platform.onrender.com,https://procv.prosolutions.page,https://projobs.prosolutions.page,http://localhost:3000,http://localhost:5173
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: IDENTITY_JWT_SECRET
        sync: false
      - key: IDENTITY_JWT_EXPIRES_IN
        value: 15m
      - key: IDENTITY_JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: IDENTITY_ISSUER
        value: https://identity.prosolutions.page
      - key: IDENTITY_AUDIENCE
        value: prosolutions-api
      - key: FRONTEND_URL
        value: https://prosolutions.page
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_DOMAIN
        value: .prosolutions.page
      - key: CORS_ORIGIN
        value: https://procv.prosolutions.page,https://projobs.prosolutions.page
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@prosolutions.page
      - key: DISABLE_RATE_LIMIT
        value: false
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: 30

  - type: web
    name: prosolutions
    env: static
    region: oregon
    plan: free
    buildCommand: npm run build --workspace=apps/core
    publishPath: apps/core/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_IDENTITY_API_URL
        value: https://identity.prosolutions.page/api/auth
      - key: VITE_PROCV_URL
        value: https://procv.prosolutions.page
      - key: VITE_PROCV_API_BASE_URL
        value: https://procvbkn.onrender.com/api
      - key: VITE_ADSENSE_CLIENT
        value: ca-pub-3956322934366702

  - type: web
    name: procv-frontend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/procv/frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_IDENTITY_API_URL
        value: https://identity.prosolutions.page/api/auth
      - key: VITE_PROSOLUTIONS_URL
        value: https://prosolutions.page
      - key: VITE_PROCV_URL
        value: https://procv.prosolutions.page

  - type: web
    name: procv-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/procv/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: IDENTITY_JWT_SECRET
        sync: false
      - key: IDENTITY_URL
        value: https://identity.prosolutions.page
      - key: FRONTEND_URL
        value: https://procv.prosolutions.page
      - key: CORS_ORIGIN
        value: https://procv.prosolutions.page,https://projobs.prosolutions.page,https://prosolutions.page,https://www.prosolutions.page
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false

  # ProJobs v2 web (React SPA). Mirrors the live static site "ProJobs" (rootDir apps/projobs).
  - type: web
    name: projobs-frontend
    env: static
    region: oregon
    plan: free
    rootDir: apps/projobs
    buildCommand: npm install --include=dev && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: false
    envVars:
      - key: VITE_PROJOBS_API_URL
        value: https://projobs-api-0clw.onrender.com
      - key: VITE_IDENTITY_API_URL
        value: https://identity.prosolutions.page/api/auth
      - key: VITE_CORE_URL
        value: https://prosolutions.page
      - key: VITE_PROCV_URL
        value: https://procv.prosolutions.page
      - key: VITE_ADSENSE_CLIENT
        value: ca-pub-3956322934366702

  # ProJobs v2 API. Mirrors the live native Node service "ProJobs API" (rootDir apps/projobs/server).
  # Schema changes run separately: MIGRATION_DATABASE_URL=<owner URL> npm run migrate.
  - type: web
    name: projobs-api
    env: node
    region: oregon
    plan: free
    rootDir: apps/projobs/server
    buildCommand: npm ci --include=dev --workspaces=false && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PROJOBS_DB_RUNTIME_ROLE
        value: projobs_api
      - key: IDENTITY_JWT_SECRET
        sync: false
      - key: IDENTITY_ISSUER
        value: https://identity.prosolutions.page
      - key: IDENTITY_AUDIENCE
        value: prosolutions-api
      - key: PROCV_API_URL
        value: https://procvbkn.onrender.com
      - key: PROJOBS_INTERNAL_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: https://projobs.prosolutions.page,https://prosolutions.page,https://www.prosolutions.page
