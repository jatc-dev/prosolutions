# ProSolutions — Render services (documentation of the live configuration).
#
# Reconciled with the Render dashboard on 2026-11-20 (12 services, two
# workspaces). The dashboard remains the source of truth and Blueprint Sync is
# NOT used: applying this file could recreate or rename services. Update this
# file whenever a service changes in the dashboard.
#
# Environment variables are listed by name only (`sync: false`): values live in
# Render and are documented in docs/deployment/ENVIRONMENT_VARIABLES.md.
# Node.js is pinned to 22.x through `engines` and `.node-version`; the Docker
# images use node:22.
#
# Workspaces:
#   ProSolutions-ProCV : Core (ProSolutions) and ProCV (frontend + backend)
#   ProJobs-ProIdentity: ProIdentity and ProJobs (web + API)
# Free web services sleep after 15 minutes without traffic and share 750
# instance hours per workspace per month.

services:
  # ---------------------------------------------------------------- Core ----
  - type: web
    runtime: static
    name: ProSolutions            # https://prosolutions.page
    repo: https://github.com/jatc-dev/prosolutions
    branch: main
    rootDir: apps/core
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:  # rootDir alone missed packages/ui and ProCV phrases.ts
      paths: ["apps/core/**", "packages/ui/**", "apps/procv/frontend/src/modules/procv/phrases.ts", "package.json", "package-lock.json"]
    routes:
      # Prerendered pages are files; everything else gets the noindex SPA shell.
      - type: rewrite
        source: /*
        destination: /app.html
    envVars:
      - { key: VITE_GTM_ID, sync: false }   # Google Tag Manager (production only)
      - { key: VITE_CORE_URL, sync: false }
      - { key: VITE_PROCV_URL, sync: false }
      - { key: VITE_PROJOBS_URL, sync: false }
      - { key: VITE_PROCV_API_BASE_URL, sync: false }
      - { key: VITE_ADSENSE_CLIENT_ID, sync: false }
      - { key: VITE_ADSENSE_CLIENT, sync: false }   # legacy alias of VITE_ADSENSE_CLIENT_ID
      - { key: ADS_TXT_CONTENT, sync: false }

  - type: web
    runtime: static
    name: ProSolutions-QA         # https://qa.prosolutions.page (Cloudflare Worker)
    repo: https://github.com/jatc-dev/prosolutions
    branch: qa
    buildCommand: npm install && npm run build:core
    staticPublishPath: apps/core/dist
    autoDeploy: true
    buildFilter:  # only rebuild when Core (or code it imports) changes
      paths: ["apps/core/**", "packages/ui/**", "apps/procv/frontend/src/modules/procv/phrases.ts", "package.json", "package-lock.json"]
    routes:
      - type: rewrite
        source: /*
        destination: /app.html
    envVars:
      - { key: VITE_CORE_URL, sync: false }
      - { key: VITE_IDENTITY_API_URL, sync: false }
      - { key: VITE_PROCV_URL, sync: false }
      - { key: VITE_PROCV_APP_URL, sync: false }
      - { key: VITE_PROCV_API_BASE_URL, sync: false }
      - { key: VITE_PROJOBS_URL, sync: false }
      - { key: VITE_ADSENSE_CLIENT_ID, sync: false }
      - { key: ADS_TXT_CONTENT, sync: false }

  # ------------------------------------------------------------ ProCV web ----
  - type: web
    runtime: static
    name: ProCVFrontEnd           # https://procv.prosolutions.page
    repo: https://github.com/jatc-dev/prosolutions
    branch: main
    buildCommand: npm install && npm run build:ui && npm --prefix apps/procv/frontend run build  # frontend only
    staticPublishPath: apps/procv/frontend/dist
    autoDeploy: true
    buildFilter:
      paths: ["apps/procv/frontend/**", "apps/procv/package.json", "packages/ui/**", "package.json", "package-lock.json"]
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - { key: VITE_GTM_ID, sync: false }   # Google Tag Manager (production only)
      - { key: VITE_API_BASE_URL, sync: false }
      - { key: VITE_CORE_URL, sync: false }
      - { key: VITE_PROCV_URL, sync: false }
      - { key: VITE_PROJOBS_URL, sync: false }
      - { key: VITE_APP_NAME, sync: false }
      - { key: VITE_ADSENSE_CLIENT, sync: false }

  - type: web
    runtime: static
    name: ProCVFrontEnd-QA        # https://procv-qa.prosolutions.page (Cloudflare Worker)
    repo: https://github.com/jatc-dev/prosolutions
    branch: qa
    buildCommand: npm install && npm run build:ui && npm --prefix apps/procv/frontend run build  # frontend only
    staticPublishPath: apps/procv/frontend/dist
    autoDeploy: true
    buildFilter:
      paths: ["apps/procv/frontend/**", "apps/procv/package.json", "packages/ui/**", "package.json", "package-lock.json"]
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - { key: VITE_API_BASE_URL, sync: false }
      - { key: VITE_API_URL, sync: false }
      - { key: VITE_CORE_URL, sync: false }
      - { key: VITE_IDENTITY_API_URL, sync: false }
      - { key: VITE_IDENTITY_URL, sync: false }
      - { key: VITE_PROCV_URL, sync: false }
      - { key: VITE_PROJOBS_URL, sync: false }
      - { key: VITE_PROSOLUTIONS_URL, sync: false }

  # -------------------------------------------------------- ProCV backend ----
  # Same Docker image as QA (multi-stage, root lockfile, build-time PDF test).
  # Replaced the native-Node service ProCVBackEnd (procvbkn.onrender.com) on
  # 2026-11-20. Runtime DB: DATABASE_URL (procv_login, pooler, RLS) +
  # PROCV_ADMIN_DATABASE_URL (procv_admin_login, pooler) for the admin pool.
  # No custom domain: the free workspace's two are used by production sites.
  - type: web
    runtime: docker
    name: ProCV-API               # https://procv-api.onrender.com
    repo: https://github.com/jatc-dev/prosolutions
    branch: main
    plan: free
    region: oregon
    dockerfilePath: ./apps/procv/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths: ["apps/procv/backend/**", "package.json", "package-lock.json"]
    envVars:
      - { key: NODE_ENV, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: PROCV_ADMIN_DATABASE_URL, sync: false }
      - { key: PROCV_RLS_CONTEXT_KEY, sync: false }
      - { key: IDENTITY_JWT_SECRET, sync: false }
      - { key: IDENTITY_ISSUER, sync: false }
      - { key: IDENTITY_AUDIENCE, sync: false }
      - { key: IDENTITY_URL, sync: false }
      - { key: CORS_ORIGIN, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: COOKIE_DOMAIN, sync: false }
      - { key: COOKIE_SAME_SITE, sync: false }
      - { key: COOKIE_SECURE, sync: false }
      - { key: HEALTH_DB_TIMEOUT_MS, sync: false }
      - { key: SESSION_IDLE_TIMEOUT_MINUTES, sync: false }
      - { key: PROCV_INTERNAL_TOKEN, sync: false }   # 32+ chars; /api/internal returns 404 without it
      - { key: GROQ_API_KEY, sync: false }           # CV assistant (free tier, gpt-oss-120b); enable Zero Data Retention in Groq
      - { key: ANTHROPIC_API_KEY, sync: false }      # paid alternative; used first when both keys exist
      - { key: AI_PROVIDER, sync: false }            # optional: groq | anthropic (forces one provider)
      - { key: AI_MODEL, sync: false }               # optional; default openai/gpt-oss-120b (groq) or claude-sonnet-5-5
      - { key: AI_DAILY_LIMIT, sync: false }         # optional; suggestions per user per day (default 30)
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, sync: false }
      - { key: SMTP_SECURE, sync: false }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: SMTP_FROM, sync: false }
      # Compatibility fallbacks in config.ts, unused while IDENTITY_JWT_SECRET is set:
      - { key: JWT_SECRET, sync: false }
      - { key: JWT_EXPIRES_IN, sync: false }
      - { key: JWT_REFRESH_EXPIRES_IN, sync: false }

  - type: web
    runtime: docker
    name: ProCVBackEnd-QA         # https://procv-backend-qa-v2.onrender.com
    repo: https://github.com/jatc-dev/prosolutions
    branch: qa
    plan: free
    region: oregon
    dockerfilePath: ./apps/procv/backend/Dockerfile
    dockerContext: .
    autoDeploy: true
    buildFilter:
      paths: ["apps/procv/backend/**", "package.json", "package-lock.json"]
    envVars:
      - { key: NODE_ENV, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: DIRECT_DATABASE_URL, sync: false }
      - { key: PROCV_ADMIN_DATABASE_URL, sync: false }
      - { key: PROCV_RLS_CONTEXT_KEY, sync: false }
      - { key: IDENTITY_JWT_SECRET, sync: false }
      - { key: IDENTITY_ISSUER, sync: false }
      - { key: IDENTITY_AUDIENCE, sync: false }
      - { key: IDENTITY_URL, sync: false }
      - { key: CORS_ORIGIN, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: COOKIE_SAME_SITE, sync: false }
      - { key: COOKIE_SECURE, sync: false }
      - { key: HEALTH_DB_TIMEOUT_MS, sync: false }
      - { key: SESSION_IDLE_TIMEOUT_MINUTES, sync: false }
      - { key: PROCV_INTERNAL_TOKEN, sync: false }   # 32+ chars; /api/internal returns 404 without it
      - { key: GROQ_API_KEY, sync: false }           # CV assistant (free tier, gpt-oss-120b); enable Zero Data Retention in Groq
      - { key: ANTHROPIC_API_KEY, sync: false }      # paid alternative; used first when both keys exist
      - { key: AI_PROVIDER, sync: false }            # optional: groq | anthropic (forces one provider)
      - { key: AI_MODEL, sync: false }               # optional; default openai/gpt-oss-120b (groq) or claude-sonnet-5-5
      - { key: AI_DAILY_LIMIT, sync: false }         # optional; suggestions per user per day (default 30)

  # ---------------------------------------------------------- ProIdentity ----
  - type: web
    runtime: docker
    name: ProIdentity             # https://identity.prosolutions.page
    repo: https://github.com/jatc-dev/prosolutions
    branch: main
    plan: free
    region: oregon
    dockerfilePath: ./apps/identity/Dockerfile
    dockerContext: ./apps/identity
    healthCheckPath: /health
    autoDeploy: true
    # Does not migrate on start: apply Prisma migrations in Neon before merging.
    envVars:
      - { key: NODE_ENV, sync: false }
      - { key: PORT, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: DIRECT_DATABASE_URL, sync: false }
      - { key: IDENTITY_JWT_SECRET, sync: false }
      - { key: IDENTITY_ISSUER, sync: false }
      - { key: IDENTITY_AUDIENCE, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: COOKIE_DOMAIN, sync: false }
      - { key: COOKIE_SAME_SITE, sync: false }
      - { key: COOKIE_SECURE, sync: false }
      - { key: SESSION_IDLE_TIMEOUT_MINUTES, sync: false }
      - { key: DISABLE_RATE_LIMIT, sync: false }   # must stay "false"
      - { key: CONTACT_INBOX, sync: false }
      - { key: PROCV_BACKEND_URL, sync: false }   # https://procv-api.onrender.com (admin console proxy; 503 without it)
      - { key: PROJOBS_API_URL, sync: false }
      - { key: PROJOBS_INTERNAL_TOKEN, sync: false }
      - { key: PROCV_INTERNAL_TOKEN, sync: false }   # same value as ProCV API (32+ chars); admin user summary/erasure
      - { key: MFA_ENCRYPTION_KEY, sync: false }     # 64 hex chars (openssl rand -hex 32); encrypts TOTP secrets. Never change it once users enable MFA
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, sync: false }
      - { key: SMTP_SECURE, sync: false }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: SMTP_FROM, sync: false }
      # Legacy, not read by the current code (candidates for removal):
      - { key: CORS_ORIGIN, sync: false }
      - { key: PROCV_DATABASE_JWT_SECRET, sync: false }

  - type: web
    runtime: docker
    name: ProIdentity-QA          # https://identity-qa.prosolutions.page (Cloudflare Worker)
    repo: https://github.com/jatc-dev/prosolutions
    branch: qa
    plan: free
    region: oregon
    dockerfilePath: ./apps/identity/Dockerfile
    dockerContext: ./apps/identity
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: DIRECT_DATABASE_URL, sync: false }
      - { key: IDENTITY_JWT_SECRET, sync: false }
      - { key: IDENTITY_JWT_EXPIRES_IN, sync: false }
      - { key: IDENTITY_JWT_REFRESH_EXPIRES_IN, sync: false }
      - { key: IDENTITY_ISSUER, sync: false }
      - { key: IDENTITY_AUDIENCE, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: ADDITIONAL_ALLOWED_ORIGINS, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: COOKIE_DOMAIN, sync: false }
      - { key: COOKIE_NAME_SUFFIX, sync: false }   # "_qa": never remove while COOKIE_DOMAIN=.prosolutions.page
      - { key: COOKIE_SAME_SITE, sync: false }
      - { key: COOKIE_SECURE, sync: false }
      - { key: CONTACT_INBOX, sync: false }
      - { key: PROCV_BACKEND_URL, sync: false }
      - { key: PROJOBS_API_URL, sync: false }
      - { key: PROJOBS_INTERNAL_TOKEN, sync: false }
      - { key: PROCV_INTERNAL_TOKEN, sync: false }   # same value as ProCV API (32+ chars); admin user summary/erasure
      - { key: MFA_ENCRYPTION_KEY, sync: false }     # 64 hex chars (openssl rand -hex 32); encrypts TOTP secrets. Never change it once users enable MFA

  # ---------------------------------------------------------- ProJobs web ----
  - type: web
    runtime: static
    name: ProJobs                 # https://projobs.prosolutions.page
    repo: https://github.com/jatc-dev/prosolutions
    branch: main
    rootDir: apps/projobs
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      paths: ["apps/projobs/**", "packages/ui/**"]
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: https://projobs-api-0clw.onrender.com/api/sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - { key: VITE_GTM_ID, sync: false }   # Google Tag Manager (production only)
      - { key: VITE_CORE_URL, sync: false }
      - { key: VITE_IDENTITY_API_URL, sync: false }
      - { key: VITE_PROCV_URL, sync: false }
      - { key: VITE_PROJOBS_URL, sync: false }
      - { key: VITE_PROJOBS_API_URL, sync: false }
      - { key: VITE_ADSENSE_CLIENT, sync: false }

  - type: web
    runtime: static
    name: ProJobs-QA              # https://projobs-qa.prosolutions.page (Cloudflare Worker)
    repo: https://github.com/jatc-dev/prosolutions
    branch: qa
    rootDir: apps/projobs
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      paths: ["apps/projobs/**", "packages/ui/**"]
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: https://projobs-api-qa.onrender.com/api/sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - { key: VITE_CORE_URL, sync: false }
      - { key: VITE_IDENTITY_API_URL, sync: false }
      - { key: VITE_PROCV_URL, sync: false }
      - { key: VITE_PROJOBS_URL, sync: false }
      - { key: VITE_PROJOBS_API_URL, sync: false }
      - { key: VITE_ADSENSE_CLIENT, sync: false }

  # ---------------------------------------------------------- ProJobs API ----
  - type: web
    runtime: node
    name: ProJobs API             # https://projobs-api-0clw.onrender.com
    repo: https://github.com/jatc-dev/prosolutions
    branch: main
    plan: free
    region: oregon
    rootDir: apps/projobs/server
    buildCommand: npm ci --include=dev --workspaces=false && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Manual deploys: SQL migrations are applied in Neon first.
    autoDeploy: false
    envVars:
      - { key: NODE_ENV, sync: false }
      - { key: PORT, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: IDENTITY_JWT_SECRET, sync: false }
      - { key: IDENTITY_ISSUER, sync: false }
      - { key: IDENTITY_AUDIENCE, sync: false }
      - { key: IDENTITY_URL, sync: false }
      - { key: PROCV_API_URL, sync: false }
      - { key: PROJOBS_INTERNAL_TOKEN, sync: false }
      - { key: CORS_ORIGIN, sync: false }
      - { key: JOOBLE_ENABLED, sync: false }
      - { key: JOOBLE_API_KEY, sync: false }
      - { key: JOOBLE_API_URL, sync: false }
      - { key: REMOTIVE_ENABLED, sync: false }
      - { key: CAREERJET_API_KEY, sync: false }

  - type: web
    runtime: node
    name: ProJobs-API-QA          # https://projobs-api-qa.onrender.com
    repo: https://github.com/jatc-dev/prosolutions
    branch: qa
    plan: free
    region: oregon
    rootDir: apps/projobs/server
    buildCommand: npm ci --include=dev --workspaces=false && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: PROJOBS_DB_RUNTIME_ROLE, sync: false }
      - { key: IDENTITY_JWT_SECRET, sync: false }
      - { key: IDENTITY_ISSUER, sync: false }
      - { key: IDENTITY_AUDIENCE, sync: false }
      - { key: PROCV_API_URL, sync: false }
      - { key: PROJOBS_INTERNAL_TOKEN, sync: false }
      - { key: PUBLIC_WEB_URL, sync: false }
      - { key: CORS_ORIGIN, sync: false }
      - { key: JOOBLE_ENABLED, sync: false }
      - { key: JOOBLE_API_KEY, sync: false }
      - { key: JOOBLE_API_URL, sync: false }
      - { key: REMOTIVE_ENABLED, sync: false }
      - { key: CAREERJET_API_KEY, sync: false }
